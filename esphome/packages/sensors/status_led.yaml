substitutions:
  led_invert: "false"
  led_strobe_on: 50ms
  led_strobe_off: 100ms

light:
  - platform: status_led
    id: led
    name: "LED"
    pin:
      number: "${led_pin}"
      inverted: "${led_invert}"
    icon: "mdi:led-outline"
    effects:
      - strobe:
          colors:
            - state: true
              duration: "${led_strobe_on}"
            - state: false
              duration: "${led_strobe_off}"
      # The media_player and voice_assistant packages request "Fast Pulse" and
      # "Slow Pulse" by name. status_led is a binary light, so it cannot do the
      # `pulse` effect that led.yaml and rgb_led.yaml use -- ESPHome rejects it
      # with "the effect 'pulse' is not allowed for this light type". These
      # provide the same names as blink equivalents, so status_led stays a
      # drop-in alternative to the other two LED packages.
      - strobe:
          name: "Fast Pulse"
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms
      - strobe:
          name: "Slow Pulse"
          colors:
            - state: true
              duration: 1s
            - state: false
              duration: 1s

esphome:
  on_boot:
    - priority: 0
      then:
        - light.turn_on: led
        - delay: 2s
        - light.turn_off: led
