name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Package changes here reach devices via `ref:`, so catch upstream ESPHome
  # regressions before a device build does. The i2s_audio media player removal
  # is exactly the kind of thing this is for.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  esphome-config:
    name: esphome config (${{ matrix.esphome-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        esphome-version:
          - "2026.8.2"  # currently validated against
          - "latest"    # next version to move to
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: |
          if [ "${{ matrix.esphome-version }}" = "latest" ]; then
            pip install esphome
          else
            pip install "esphome==${{ matrix.esphome-version }}"
          fi
          esphome version

      - name: Validate every fixture
        run: |
          shopt -s nullglob
          failed=0
          for f in tests/*.yaml; do
            [ "$(basename "$f")" = "secrets.yaml" ] && continue
            echo "::group::$f"
            out=$(esphome config "$f" 2>&1) || { echo "$out"; echo "::error file=$f::esphome config failed"; failed=1; echo "::endgroup::"; continue; }
            echo "$out"
            # esphome only WARNS on an unresolved substitution and still exits 0,
            # so a typo like "$Foo{bar}" would otherwise ship silently.
            if grep -qE "could not resolve all the variables|is undefined" <<<"$out"; then
              echo "::error file=$f::unresolved substitution"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
