# CI fixture: ESP32-S3 mini, speaker media player + LD2410 radar.
# Mirrors the "bedroom" device.
substitutions:
  name: "ci-s3-media-player-ld2410"
  friendly_name: "CI S3 Media Player LD2410"
  bh1750_update_interval: "30s"
  ld2410_max_distance_move: "6m"
  ld2410_max_distance_still: "6m"
  ld2410_timeout: "5s"
  pir_delayed_off: "10s"
  pir_delayed_on: "0s"

packages:
  base: !include ../esphome/packages/config/base.yaml
  board: !include ../esphome/packages/config/esp32-s3-mini.yaml
  bh1750: !include ../esphome/packages/sensors/bh1750.yaml
  bme280: !include ../esphome/packages/sensors/bme280.yaml
  buzzer: !include ../esphome/packages/sensors/buzzer.yaml
  occupancy: !include ../esphome/packages/sensors/occupancy.yaml
  pir: !include ../esphome/packages/sensors/pir.yaml
  media_player: !include ../esphome/packages/sensors/media_player-psram.yaml
  rgb_led: !include ../esphome/packages/sensors/rgb_led.yaml
  ld2410: !include ../esphome/packages/sensors/ld2410.yaml
api:
  encryption:
    key: !secret apikey

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
